[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aurora"
version = "0.1.0"
description = "Assistente do Residencial Aurora"
requires-python = ">=3.12"
dependencies = [
    "google-adk[db]==2.2.0",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "aiosqlite>=0.21,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "python-dotenv>=1,<2",
]

[dependency-groups]
dev = [
    "mypy>=1.13,<2",
    "ruff>=0.9,<1",
]

[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src/aurora"]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[tool.hatch.build.targets.wheel]
packages = ["src/aurora"]

[project.scripts]
aurora = "aurora.cli:main"
